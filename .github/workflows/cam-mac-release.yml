name: Build CAM v2026.11.08.1 on Apple Silicon
on:
  push:
    branches: [codex/cam-release-mac-2026-11-08-1]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check out tagged CAM source
        run: |
          git fetch origin tag v2026.11.08.1
          git worktree add --detach "$RUNNER_TEMP/cam-release-src" v2026.11.08.1
          test "$(git -C "$RUNNER_TEMP/cam-release-src" rev-parse HEAD)" = 27ec653ffa2b2b3466401eb0bf9165635c503d52
      - name: Build signed CAM ZIP and verify extracted runtime
        run: |
          python3 "$RUNNER_TEMP/cam-release-src/tools/build_mac_bundle.py" --tag v2026.11.08.1 --output-dir "$RUNNER_TEMP/cam-release"
      - name: Check the extracted CAM app with fictional data
        run: |
          python3 -m venv "$RUNNER_TEMP/cam-smoke-venv"
          "$RUNNER_TEMP/cam-smoke-venv/bin/python" -m pip install playwright==1.64.1
          "$RUNNER_TEMP/cam-smoke-venv/bin/python" -m playwright install chromium
          ditto -x -k "$RUNNER_TEMP/cam-release/CAM-Mac-AppleSilicon-v2026.11.08.1.zip" "$RUNNER_TEMP/cam-extracted"
          codesign --verify --deep --strict "$RUNNER_TEMP/cam-extracted/CAM.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CAMReleaseVersion' "$RUNNER_TEMP/cam-extracted/CAM.app/Contents/Info.plist")" = 2026.11.08.1
          "$RUNNER_TEMP/cam-smoke-venv/bin/python" .github/cam-release-smoke.py "$RUNNER_TEMP/cam-release-src" "$RUNNER_TEMP/cam-extracted"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: CAM-Mac-AppleSilicon-v2026.11.08.1
          path: ${{ runner.temp }}/cam-release/CAM-Mac-AppleSilicon-v2026.11.08.1.zip
          if-no-files-found: error
