name: Build and test CAM Google Drive sign-in on Windows
on:
  push:
    branches: [codex/cam-drive-signin-build]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Build the Windows ZIP from the candidate source
        shell: pwsh
        run: |
          Copy-Item .github/drive-signin-smoke.py "$env:RUNNER_TEMP/drive-signin-smoke.py"
          git switch --detach 60fe0c8ccbb1948484d261305f5a9bbf93bfe82f
          git rev-parse HEAD "HEAD^{tree}"
          python tools/build_windows_bundle.py --version 2026.11.10-drive-signin-test --output-dir "$env:RUNNER_TEMP/cam-release"
          Get-FileHash "$env:RUNNER_TEMP/cam-release/*.zip" -Algorithm SHA256
      - name: Smoke test the extracted ZIP with fictional data and loopback OAuth
        shell: pwsh
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
          $archive = (Get-ChildItem "$env:RUNNER_TEMP/cam-release/*.zip").FullName
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/cam-extracted"
          python "$env:RUNNER_TEMP/drive-signin-smoke.py" "$env:GITHUB_WORKSPACE" "$env:RUNNER_TEMP/cam-extracted"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: CAM-Windows-2026.11.10-drive-signin-test
          path: ${{ runner.temp }}/cam-release/*.zip
          if-no-files-found: error
